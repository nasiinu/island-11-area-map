<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>無人島11エリア｜接続マップ・移動抽選</title>
  <style>
    :root{--bg:#071411;--panel:#10231f;--panel2:#142d28;--ink:#edf8f2;--muted:#a9c1b8;--line:#6d8d83;--active:#ffe090;--sea:#82d9f4;--forest:#8cdaa0;--building:#d8c5a0;--open:#d7bd86;--tower:#d7b4f5}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#18352d 0,var(--bg) 62%);color:var(--ink);font-family:"Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;min-height:100vh}
    main{width:min(1180px,100%);margin:auto;padding:20px}.head{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    h1{font-size:clamp(20px,3vw,32px);margin:0}.lead{color:var(--muted);margin:6px 0 0;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid #42655b;background:#18372f;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}button:hover,button:focus-visible{border-color:var(--active);outline:none}.primary{background:#745b1c;border-color:#caa84e}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.map-card,.info{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid #29483f;border-radius:16px;box-shadow:0 14px 40px #0008}
    .map-card{position:relative;overflow:hidden;min-height:620px}.map-card:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,#234d3f 0,#183b32 40%,#0a2624 70%,#0b2637 100%);opacity:.9}
    svg{position:relative;display:block;width:100%;height:620px}.route{stroke:var(--line);stroke-width:3;opacity:.72;transition:.18s;vector-effect:non-scaling-stroke}.route.active{stroke:var(--active);stroke-width:6;opacity:1}.route.dim{opacity:.14}
    .node{cursor:pointer}.node circle{stroke:#06100e;stroke-width:4;filter:drop-shadow(0 5px 5px #0009);transition:.18s}.node text{fill:#071411;font-size:17px;font-weight:900;text-anchor:middle;pointer-events:none}.node:hover circle,.node:focus circle,.node.selected circle{stroke:var(--active);stroke-width:7}.node.dim{opacity:.38}.beach circle{fill:var(--sea)}.forest circle{fill:var(--forest)}.building circle{fill:var(--building)}.open circle{fill:var(--open)}.tower circle{fill:var(--tower)}
    .info{padding:18px;min-height:620px}#placeName{font-size:26px;margin:0 0 8px}.tag{display:inline-block;border:1px solid #4e7569;border-radius:99px;padding:3px 9px;color:#c8ded6;font-size:12px;margin-bottom:14px}.info h3{font-size:14px;color:var(--muted);margin:18px 0 8px}.neighbors{display:flex;flex-wrap:wrap;gap:7px}.neighbor{background:#1a3931;border:1px solid #4b7065;border-radius:9px;padding:6px 9px;font-size:13px}.result{min-height:86px;margin-top:10px;padding:14px;border-radius:12px;background:#091915;border:1px solid #29483f;display:grid;place-items:center;text-align:center}.result strong{display:block;color:var(--active);font-size:23px;margin-top:4px}.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.7}
    @media(max-width:800px){main{padding:10px}.grid{grid-template-columns:1fr}.map-card{min-height:auto}svg{height:auto;aspect-ratio:9/10}.info{min-height:auto}.node text{font-size:15px}.route{stroke-width:2.5}}
    @media(prefers-reduced-motion:no-preference){.result.roll strong{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.12)}}}
  </style>
</head>
<body>
<main>
  <div class="head"><div><h1>無人島11エリア 接続マップ</h1><p class="lead">エリアを選択すると隣接経路を強調表示。移動抽選には「その場に留まる」も含まれます。</p></div><div class="actions"><button id="reset">全経路を表示</button><button id="roll" class="primary">選択エリアから移動抽選</button></div></div>
  <div class="grid">
    <section class="map-card" aria-label="無人島の接続図">
      <svg viewBox="0 0 900 620" role="img" aria-labelledby="mapTitle mapDesc">
        <title id="mapTitle">無人島11エリアの双方向接続マップ</title><desc id="mapDesc">各エリアをクリックすると隣接エリアが強調されます。</desc>
        <g id="routes"></g><g id="nodes"></g>
      </svg>
    </section>
    <aside class="info" aria-live="polite">
      <div class="tag">双方向移動</div><h2 id="placeName">浜辺1</h2><div id="placeKind"></div>
      <h3>直接移動できるエリア</h3><div id="neighbors" class="neighbors"></div>
      <h3>移動抽選</h3><div id="odds"></div><div id="result" class="result">上のボタンで抽選できます</div>
      <p class="note">経路の途中に別エリアがある場合は、原則としてそのエリアを経由します。1フェーズにつき基本1区画です。</p>
    </aside>
  </div>
  <div class="legend"><span style="--c:var(--sea)">浜辺</span><span style="--c:var(--forest)">森</span><span style="--c:var(--building)">建物</span><span style="--c:var(--open)">空き地</span><span style="--c:var(--tower)">展望台</span></div>
</main>
<script>
const areas={
  "展望台":{x:125,y:205,type:"tower",kind:"西側の山上"},"浜辺1":{x:280,y:85,type:"beach",kind:"北西の海岸"},"森1":{x:370,y:230,type:"forest",kind:"比較的浅い森林"},
  "建物1":{x:245,y:365,type:"building",kind:"島内最大の施設"},"浜辺2":{x:120,y:505,type:"beach",kind:"南西の海岸"},"建物2":{x:455,y:440,type:"building",kind:"島内で二番目に大きい施設"},
  "空き地1":{x:310,y:555,type:"open",kind:"廃墟・身を隠せる場所"},"空き地2":{x:590,y:190,type:"open",kind:"森2の上側付近"},"森2":{x:640,y:350,type:"forest",kind:"洞窟のある森林"},
  "森3":{x:785,y:205,type:"forest",kind:"山に近い深い森林"},"浜辺3":{x:785,y:490,type:"beach",kind:"崖のある東側海岸"}
};
const edges=[["展望台","浜辺1"],["展望台","森1"],["展望台","建物1"],["浜辺1","森1"],["浜辺1","建物1"],["森1","建物1"],["森1","空き地2"],["建物1","浜辺2"],["建物1","建物2"],["浜辺2","建物2"],["浜辺2","空き地1"],["建物2","浜辺3"],["建物2","森2"],["建物2","空き地1"],["森2","空き地2"],["森2","森3"],["森2","浜辺3"],["空き地2","森3"]];
const neighbors=Object.fromEntries(Object.keys(areas).map(n=>[n,[]]));edges.forEach(([a,b])=>{neighbors[a].push(b);neighbors[b].push(a)});
const svgNS="http://www.w3.org/2000/svg",routes=document.querySelector("#routes"),nodes=document.querySelector("#nodes");
edges.forEach(([a,b])=>{const e=document.createElementNS(svgNS,"line"),A=areas[a],B=areas[b];e.setAttribute("x1",A.x);e.setAttribute("y1",A.y);e.setAttribute("x2",B.x);e.setAttribute("y2",B.y);e.classList.add("route");e.dataset.a=a;e.dataset.b=b;routes.append(e)});
Object.entries(areas).forEach(([name,a])=>{const g=document.createElementNS(svgNS,"g");g.classList.add("node",a.type);g.dataset.name=name;g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",name+"を選択");g.setAttribute("transform",`translate(${a.x} ${a.y})`);const c=document.createElementNS(svgNS,"circle");c.setAttribute("r",name.length>3?49:44);const t=document.createElementNS(svgNS,"text");t.setAttribute("dy",".35em");t.textContent=name;g.append(c,t);g.addEventListener("click",()=>select(name));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(name)}});nodes.append(g)});
let selected="浜辺1";
function select(name){selected=name;document.querySelector("#placeName").textContent=name;document.querySelector("#placeKind").textContent=areas[name].kind;document.querySelector("#neighbors").innerHTML=neighbors[name].map(n=>`<button class="neighbor" data-go="${n}">${n}</button>`).join("");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go));document.querySelector("#odds").textContent=`1D${neighbors[name].length+1}（移動先 ${neighbors[name].length}＋留まる）`;document.querySelector("#result").className="result";document.querySelector("#result").textContent="上のボタンで抽選できます";document.querySelectorAll(".node").forEach(n=>{n.classList.toggle("selected",n.dataset.name===name);n.classList.toggle("dim",n.dataset.name!==name&&!neighbors[name].includes(n.dataset.name))});document.querySelectorAll(".route").forEach(r=>{const on=r.dataset.a===name||r.dataset.b===name;r.classList.toggle("active",on);r.classList.toggle("dim",!on)})}
document.querySelector("#roll").onclick=()=>{const choices=[...neighbors[selected],selected+"に留まる"],pick=choices[Math.floor(Math.random()*choices.length)],box=document.querySelector("#result");box.className="result";void box.offsetWidth;box.className="result roll";box.innerHTML=`抽選結果<strong>${pick}</strong>`};
document.querySelector("#reset").onclick=()=>{document.querySelectorAll(".node,.route").forEach(e=>e.classList.remove("selected","active","dim"));document.querySelector("#result").textContent="エリアを選択してください"};select(selected);
</script>
</body>
</html>
