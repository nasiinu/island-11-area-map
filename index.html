<!doctype html>
<html lang="ja"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>無人島11エリア｜接続マップ・移動抽選</title>
  <style>
    :root{--bg:#070b11;--node:#293240;--line:#505866;--blue:#3b8cff;--cyan:#22d6c4;--ink:#f5f8fc;--muted:#aeb8c7}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
    main{height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding:6px}
    header{height:36px;display:flex;align-items:center;gap:8px;padding:0 5px;z-index:2}
    h1{font-size:15px;line-height:1;margin:0;white-space:nowrap}.status{min-width:0;margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status strong{color:var(--cyan)}
    .actions{display:flex;gap:5px}button{border:1px solid #3e4b5e;background:#151c26;color:var(--ink);border-radius:7px;padding:5px 9px;font:700 11px inherit;cursor:pointer;white-space:nowrap}button:hover,button:focus-visible{border-color:var(--cyan);outline:none}.primary{background:#124841;border-color:#258c81}
    .map{position:relative;min-height:0;overflow:hidden;border:1px solid #1e2733;border-radius:10px;background:radial-gradient(circle at 50% 45%,#111925 0,var(--bg) 68%)}
    svg{display:block;width:100%;height:100%}.route{stroke:var(--line);stroke-width:3;opacity:.78;vector-effect:non-scaling-stroke;transition:.15s}.route.active{stroke:var(--cyan);stroke-width:5;opacity:1}.route.dim{opacity:.14}
    .node{cursor:pointer;transition:.15s}.node circle{fill:var(--node);stroke:var(--blue);stroke-width:3;vector-effect:non-scaling-stroke}.node text{fill:var(--ink);font-size:18px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}.node.selected circle{fill:#16998e;stroke:#5ce6d9;stroke-width:5}.node:hover circle,.node:focus circle{stroke:var(--cyan);stroke-width:5}.node:focus{outline:none}.node.dim{opacity:.42}
    @media(max-width:640px){main{padding:3px}header{height:32px}h1{font-size:12px}.status{font-size:10px}button{padding:4px 6px;font-size:10px}.node text{font-size:17px}}
    @media(max-height:360px){header{height:29px}h1{font-size:11px}.status{font-size:9px}button{padding:3px 6px;font-size:9px}.map{border-radius:7px}}
  </style>
</head>
<body>
<main>
  <header>
    <h1>無人島11エリア</h1>
    <div id="status" class="status" aria-live="polite">森2｜接続 4｜1D5</div>
    <div class="actions"><button id="reset">全経路</button><button id="roll" class="primary">移動抽選</button></div>
  </header>
  <section class="map" aria-label="無人島11エリアの双方向接続マップ">
    <svg viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mapTitle mapDesc">
      <title id="mapTitle">無人島11エリア接続マップ</title><desc id="mapDesc">エリアを選ぶと直接移動できる経路が強調されます。</desc>
      <g id="routes"></g><g id="nodes"></g></svg>
  </section>
</main>
<script>
const areas={
  "展望台":{x:115,y:220},"浜辺1":{x:240,y:70},"森1":{x:315,y:230},"建物1":{x:300,y:390},"浜辺2":{x:255,y:600},
  "建物2":{x:500,y:480},"空き地1":{x:625,y:620},"森2":{x:600,y:330},"空き地2":{x:560,y:165},"森3":{x:735,y:80},"浜辺3":{x:760,y:475}
};
const edges=[["展望台","浜辺1"],["展望台","森1"],["展望台","建物1"],["浜辺1","森1"],["浜辺1","建物1"],["森1","建物1"],["森1","空き地2"],["建物1","浜辺2"],["建物1","建物2"],["浜辺2","建物2"],["浜辺2","空き地1"],["建物2","浜辺3"],["建物2","森2"],["建物2","空き地1"],["森2","空き地2"],["森2","森3"],["森2","浜辺3"],["空き地2","森3"]];
const neighbors=Object.fromEntries(Object.keys(areas).map(n=>[n,[]]));edges.forEach(([a,b])=>{neighbors[a].push(b);neighbors[b].push(a)});
const ns="http://www.w3.org/2000/svg",routes=document.querySelector("#routes"),nodes=document.querySelector("#nodes"),status=document.querySelector("#status");
edges.forEach(([a,b])=>{const A=areas[a],B=areas[b],e=document.createElementNS(ns,"line");for(const [k,v] of Object.entries({x1:A.x,y1:A.y,x2:B.x,y2:B.y}))e.setAttribute(k,v);e.classList.add("route");e.dataset.a=a;e.dataset.b=b;routes.append(e)});
Object.entries(areas).forEach(([name,p])=>{const g=document.createElementNS(ns,"g"),c=document.createElementNS(ns,"circle"),t=document.createElementNS(ns,"text");g.classList.add("node");g.dataset.name=name;g.setAttribute("transform",`translate(${p.x} ${p.y})`);g.setAttribute("tabindex","0");g.setAttribute("role","button");g.setAttribute("aria-label",name+"を選択");c.setAttribute("r",45);t.textContent=name;g.append(c,t);g.onclick=()=>select(name);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(name)}};nodes.append(g)});
let selected="森2";
function select(name){selected=name;const near=neighbors[name];status.innerHTML=`<strong>${name}</strong>｜接続 ${near.length}｜1D${near.length+1}`;document.querySelectorAll(".node").forEach(n=>{n.classList.toggle("selected",n.dataset.name===name);n.classList.toggle("dim",n.dataset.name!==name&&!near.includes(n.dataset.name))});document.querySelectorAll(".route").forEach(r=>{const on=r.dataset.a===name||r.dataset.b===name;r.classList.toggle("active",on);r.classList.toggle("dim",!on)})}
document.querySelector("#roll").onclick=()=>{const list=[...neighbors[selected],selected+"に留まる"],pick=list[Math.floor(Math.random()*list.length)];status.innerHTML=`${selected} → <strong>${pick}</strong>（1D${list.length}）`};
document.querySelector("#reset").onclick=()=>{document.querySelectorAll(".node,.route").forEach(e=>e.classList.remove("selected","active","dim"));status.textContent="全18経路を表示"};select(selected);
</script>


</body>
</html>
